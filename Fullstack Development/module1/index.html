<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 1: Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card-container">
        <article class="profile-card" id="profileCard">
            <img src=""https://via.placeholder.com/120" alt="Profile avatar" class="avatar">
            
            <h1 class="user-name">Alex Johnson</h1>
            <p class="user-role">Frontend Developer</p>
            <p class="user-bio">Learning Html ,css and JavaScript</p>

            <button class="toggle-btn" id="themeToggleBtn">Toggle Dark Mode</button>
        </article>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
